{% load static %}

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ recipe.name }} — ВкусноДома</title>

    <link rel="stylesheet" href="{% static 'main/style.css' %}">
</head>

<body>

<header>
    <div class="logo">🍴 ВкусноДома</div>

    <nav>
        <a href="/">Главная</a>
        <a href="#">Рецепты</a>
        <a href="#">Категории</a>
    </nav>
</header>

<main class="recipe-page">

    <div class="recipe-card">

        <div class="recipe-image">
            {{ recipe.emoji }}
        </div>

        <div class="recipe-info">

            <h1>{{ recipe.name }}</h1>

            <p class="recipe-description">
                {{ recipe.description }}
            </p>

            <h2>🥕 Ингредиенты</h2>

      <div class="ingredients">
    {{ recipe.ingredients|linebreaks }}
</div>

            <h2>👨‍🍳 Приготовление</h2>

   <div class="steps">
    {{ recipe.steps|linebreaks }}
</div>

            <a href="/" class="button">
                ← Вернуться к рецептам
            </a>

        </div>

    </div>

</main>

<footer>
    <p>© 2026 ВкусноДома 🍳</p>
</footer>

</body>
</html>
